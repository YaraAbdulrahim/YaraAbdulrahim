<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yara Abdulrahim — Software Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="1" stop-color="#0a1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <!-- blueprint grid -->
    <pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#38bdf8" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#minor)"/>
      <path d="M80 0H0V80" fill="none" stroke="#38bdf8" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="360" fill="url(#fade)"/></mask>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.4s ease-in-out .8s infinite; }
    .pulse3 { animation: pulse 2.4s ease-in-out 1.6s infinite; }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .in1 { animation: in .8s ease-out both; }
    .in2 { animation: in .8s ease-out .15s both; }
    .in3 { animation: in .8s ease-out .3s both; }
    .in4 { animation: in .8s ease-out .45s both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  </style>

  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#major)" mask="url(#m)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.12"/>

  <!-- ============ LEFT: identity ============ -->
  <g class="mono in1" font-size="16">
    <text x="64" y="82"><tspan fill="#22d3ee">yara@dev</tspan><tspan fill="#64748b">:~$ </tspan><tspan fill="#e2e8f0">whoami</tspan></text>
  </g>
  <g class="in2">
    <text x="62" y="152" class="sans" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1">Yara Abdulrahim</text>
  </g>
  <g class="in3">
    <text x="64" y="198" class="sans" font-size="26" font-weight="700" fill="url(#accent)">Software Engineer</text>
    <text x="64" y="232" class="sans" font-size="21" font-weight="500" fill="#cbd5e1">Full-Stack Developer</text>
  </g>
  <g class="mono in4" font-size="14">
    <rect x="64" y="262" width="470" height="44" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="82" y="289"><tspan fill="#64748b">$ </tspan><tspan fill="#e2e8f0">design </tspan><tspan fill="#475569">→ </tspan><tspan fill="#e2e8f0">build </tspan><tspan fill="#475569">→ </tspan><tspan fill="#e2e8f0">test </tspan><tspan fill="#475569">→ </tspan><tspan fill="#e2e8f0">ship  </tspan><tspan fill="#4ade80">✓ deployed</tspan><tspan class="caret" fill="#22d3ee"> ▍</tspan></text>
  </g>

  <!-- ============ RIGHT: system architecture ============ -->
  <g class="mono" font-size="10" fill="#475569" letter-spacing="2">
    <text x="640" y="42">SYSTEM ARCHITECTURE</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke-width="2">
    <path d="M782 180 H830" stroke="#1e293b"/>
    <path class="flow" d="M782 180 H830" stroke="#22d3ee"/>
    <path d="M972 180 C992 180 990 110 1010 110" stroke="#1e293b"/>
    <path class="flow" d="M972 180 C992 180 990 110 1010 110" stroke="#818cf8"/>
    <path d="M972 180 C992 180 990 250 1010 250" stroke="#1e293b"/>
    <path class="flow" d="M972 180 C992 180 990 250 1010 250" stroke="#818cf8"/>
  </g>
  <g fill="#0b1220">
    <circle cx="782" cy="180" r="4" stroke="#22d3ee"/>
    <circle cx="830" cy="180" r="4" stroke="#22d3ee"/>
    <circle cx="972" cy="180" r="4" stroke="#818cf8"/>
    <circle cx="1010" cy="110" r="4" stroke="#818cf8"/>
    <circle cx="1010" cy="250" r="4" stroke="#818cf8"/>
  </g>

  <!-- node: client -->
  <g>
    <rect x="640" y="146" width="142" height="68" rx="10" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="711" y="186" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#f1f5f9">Frontend</text>
  </g>
  <!-- node: api -->
  <g>
    <rect x="830" y="146" width="142" height="68" rx="10" fill="#0b1220" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="901" y="186" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#f1f5f9">Backend &amp; APIs</text>
  </g>
  <!-- node: database -->
  <g>
    <rect x="1010" y="78" width="132" height="64" rx="10" fill="#0b1220" stroke="#334155"/>
    <text x="1076" y="116" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#f1f5f9">Database</text>
  </g>
  <!-- node: ai -->
  <g>
    <rect x="1010" y="218" width="132" height="64" rx="10" fill="#0b1220" stroke="#334155"/>
    <text x="1076" y="256" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#f1f5f9">AI Services</text>
  </g>

  <!-- status dots -->
  <g class="mono" font-size="11" fill="#64748b">
    <circle class="pulse" cx="646" cy="318" r="4" fill="#4ade80"/><text x="656" y="322">build</text>
    <circle class="pulse2" cx="716" cy="318" r="4" fill="#4ade80"/><text x="726" y="322">tests</text>
    <circle class="pulse3" cx="786" cy="318" r="4" fill="#4ade80"/><text x="796" y="322">deploy</text>
    <text x="1142" y="322" text-anchor="end" fill="#334155">v1.0 · production</text>
  </g>
</svg>
